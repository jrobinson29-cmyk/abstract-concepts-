const readName = () => { const v = cleanName((document.getElementById('cpName') || {}).value); try { localStorage.setItem('abstract-concepts-player-name', v); } catch (e) { } return v; };

/* ---------- lobby UI ---------- */
function guard() {

}
function nameField() { return `<label class="mp-label">PLAYER NAME<input id="cpName" class="mp-input" maxlength="14" value="${esc(savedName())}" placeholder="Enter a name" autocomplete="nickname"></label>`; }
function coopHostOpen(err) {

}
function coopMode(m) {

function connecting(t) { ov(`<h2>CONNECTING</h2><p class="mp-copy">${esc(t)}</p>`); }
function fatal(t) { cleanup(); ov(`<h2>CO-OP ERROR</h2><div class="mp-error">${esc(t)}</div><button onclick="coopHostOpen()">Host</button><button onclick="coopJoinOpen()">Join</button><button onclick="pBack()">Back</button>`); }

function cleanup() { try { if (MP.peer) MP.peer.destroy(); } catch (e) { } MP.peer = null; MP.hc = null; MP.conns.clear(); MP.on = false; MP.host = false; MP.players.forEach(p => rmAv(p)); MP.players.clear(); }

/* ---------- connection setup ---------- */
function coopCreate() {

/* ---------- client message handler ---------- */
function clientMsg(m) {

/* ---------- host: message handler ---------- */

      el.style.top = ((-_lp.y * 0.5 + 0.5) * H).toFixed(1) + "px";

  function mapFrame(dt) {

    if (T.anim) T.anim.forEach((f) => f(t, dt));

    let hov = -1;
    if (IN.mx >= 0 && IN.ptr.size === 0) hov = pickAt(IN.mx, IN.my);
    IN.hov = hov;
    try { ren.domElement.style.cursor = hov >= 0 ? "pointer" : IN.ptr.size ? "grabbing" : "grab"; } catch (e) {}
    T.markers.forEach((m, i) => {
      const sel = i === T.sel;
      m.lm.position.y = 0.25 + Math.sin(t * 1.1 + i) * 0.07;
      m.lm.rotation.y = Math.sin(t * 0.3 + i) * 0.25;
      m.ring.scale.setScalar(hov === i ? 1.08 : 1);

      if (sel) { m.sel.rotation.z += dt * 0.9; m.sel.scale.setScalar(1 + Math.sin(t * 3) * 0.05); }

  };
  window.stRwSwap = function (i) {
    const n = T.rw.weapon;
    if (n) { S.wep[i] = n; save(); }
    window.stRwDone();
  };
  function pickConcept() {
    const pool = Object.keys(CN).filter((n) => !S.con.includes(n) && !(G.gone || []).includes(n));
    if (!pool.length) {
      shell(`<div class="st-rw"><div class="st-rw-k">REWARD</div><h3 class="st-rw-name" style="font-size:22px">NOTHING LEFT TO LEARN</h3><p class="st-rw-d">Every Concept in the abstract is already yours.</p><button class="st-btn" onclick="stRwDone()">CONTINUE</button></div>`);
      return;
    }
    const n = pool[Math.floor(Math.random() * pool.length)], r = (CN[n] && CN[n].r) || 2;
    T.rw.concept = n;
    const icon = (GL && GL[n]) || "✦";
    const body = `<div class="st-rw" style="--c:${RC[r]}">
      <div class="st-rw-k">REWARD · CONCEPT</div>
      <div class="st-rw-rar">${RN[r]}</div>
      <div class="st-rw-name">${icon} ${n}</div>
      <p class="st-rw-d">${(CN[n] && CN[n].d) || ""}</p>`;
    if (S.con.length < 3) {
      shell(body + `<button class="st-btn" onclick="stRwConcept(-1)">TAKE THIS CONCEPT</button>
        <div class="st-hint">SLOTS USED ${S.con.length} / 3</div></div>`);
    } else {
      shell(body + `<div class="st-hint">THREE CONCEPTS ARE EQUIPPED — CHOOSE ONE TO REPLACE</div>
        <div class="st-pick">${S.con.map((c, i) => `<button onclick="stRwConcept(${i})">${c}</button>`).join("")}</div>
        <button class="st-btn ghost" onclick="stRwDone()">REPLACE NOTHING</button></div>`);
    }
    T.sfx(700, 0.22, "sine"); setTimeout(() => T.sfx(980, 0.3, "triangle"), 130);
  }
  window.stRwConcept = function (slot) {
    const n = T.rw.concept;
    if (n) {
      if (slot < 0) { if (S.con.length < 3) S.con.push(n); }
      else S.con[slot] = n;
      save();
    }
    window.stRwDone();
  };
  window.stRwDone = function () {
    $i("stReward").classList.remove("on");
    const cb = T.rw.done; T.rw = {};
    if (cb) cb();
  };

  /* ---------------- completion ---------------- */
  T.finish = function (i, opts) {
    opts = opts || {};
    if (!S.done[i]) { S.done[i] = 1; }
    if (i < 8) S.open = Math.max(S.open, i + 1);
    else { S.open = Math.max(S.open, 8); S.island2 = 1; }
    S.sel = Math.min(8, i + 1);
    save();
    T.openMap();
  };

  /* ---------------- transitions ---------------- */
  T.transition = function (fn) {
    const f = T.fadeEl;
    f.classList.add("on");
    setTimeout(() => { try { fn(); } catch (e) { console.error(e); } setTimeout(() => f.classList.remove("on"), 90); }, 560);
  };

  /* menu button */
  (function () {
    const menu = $i("menu");
    if (!menu) return;
    const anchorBtn = menu.querySelector('button[onclick="rushOpen()"]');
    const btn = document.createElement("button");
    btn.textContent = "Story Mode";
    btn.onclick = () => window.stOpen();
    btn.style.background = "linear-gradient(#3b2a7a,#171040)";
    btn.style.borderColor = "#c8a8ff";
    btn.style.boxShadow = "0 0 14px #8a6aff88";
    if (anchorBtn && anchorBtn.parentNode) anchorBtn.insertAdjacentElement("afterend", btn);
    else menu.appendChild(btn);
  })();

  console.log("[story] core ready");
})();
</script>
<script>
/* eslint-disable */
/* ============================================================
   ABSTRACT CONCEPTS — STORY MODE · CINEMATICS & CONVERSATIONS
   Matches 1, 6, 7 and 9.
   ============================================================ */
(function () {
  const T = window.ACStory;
  if (!T || T.cineReady) return;
  T.cineReady = 1;
  const $i = (id) => document.getElementById(id);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const C = { active: 0, i: 0, beats: [], b: 0, t: 0, acc: 0, auto: false, tick: null, hero: null, god: null, mods: {} };

  /* ---------------------------------------------------------
     shared set: Starlight City at night
     --------------------------------------------------------- */
  function citySet(opts) {
    opts = opts || {};
    T.clearStage();
    T.stageBase({ a: 0x05081a, b: 0x1d1740, near: 70, far: 260, sun: 0xa9c2ff, si: 0.9, amb: 0x36306a, ai: 1 });
    const G0 = new THREE.Group(); T.STG.add(G0);
    const dark = new THREE.MeshStandardMaterial({ color: 0x121a3c, roughness: 0.55, metalness: 0.55, emissive: 0x0a1030 });
    const lightM = new THREE.MeshBasicMaterial({ color: 0xa9dcff, transparent: true, opacity: 0.85 });
    const warmM = new THREE.MeshBasicMaterial({ color: 0xffd79a, transparent: true, opacity: 0.9 });
    const glow = new THREE.MeshBasicMaterial({ color: 0x9fb4ff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false, side: 2 });

    /* platform */
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(15, 14.2, 1.1, 64), dark);
    disc.position.y = -0.55; disc.receiveShadow = true; G0.add(disc);
    const inlay = new THREE.Mesh(new THREE.TorusGeometry(11.6, 0.09, 6, 90), glow);
    inlay.rotation.x = 1.57; inlay.position.y = 0.02; G0.add(inlay);
    const inlay2 = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.06, 6, 80), glow);
    inlay2.rotation.x = 1.57; inlay2.position.y = 0.03; G0.add(inlay2);
    const inlay3 = new THREE.Mesh(new THREE.CircleGeometry(2.4, 48), new THREE.MeshBasicMaterial({ color: 0x8fb6ff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending }));
    inlay3.rotation.x = -1.57; inlay3.position.y = 0.04; G0.add(inlay3);

    /* grand arch behind the meeting */
    const arch = new THREE.Group(); arch.position.set(0, 0, -8.5); G0.add(arch);
    for (const s of [-1, 1]) {
      const p = new THREE.Mesh(GX, dark); p.position.set(s * 5.2, 4.4, 0); p.scale.set(1.1, 8.8, 1.1); arch.add(p);
      const f = new THREE.Mesh(GX, lightM); f.position.set(s * 5.2, 4.6, 0.58); f.scale.set(1.15, 0.14, 0.04); arch.add(f);
      const l = new THREE.PointLight(0x9fc6ff, 1.6, 26); l.position.set(s * 5.2, 8.2, 0.6); arch.add(l);
    }
    const top = new THREE.Mesh(GX, dark); top.position.set(0, 8.9, 0); top.scale.set(11.5, 1.1, 1.1); arch.add(top);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.12, 8, 60), glow);
    ring.position.set(0, 5.4, 0.1); arch.add(ring);

    /* skyline */
    for (let k = 0; k < 46; k++) {
      const a = Math.random() * 6.283, r = 26 + Math.random() * 46;
      const h = 3 + Math.random() * 22, w = 1.4 + Math.random() * 3;
      const b = new THREE.Mesh(GX, new THREE.MeshStandardMaterial({ color: 0x0d1230, emissive: 0x070b1e, roughness: 0.7 }));
      b.position.set(Math.cos(a) * r, h / 2 - 9, Math.sin(a) * r);
      b.scale.set(w, h, w); b.rotation.y = Math.random() * 3; G0.add(b);
      for (let j = 0; j < 3; j++) {
        const win = new THREE.Mesh(GX, Math.random() < 0.6 ? lightM : warmM);
        win.position.set(b.position.x, -8 + j * (h / 3.2), b.position.z);
        win.scale.set(w * 1.02, 0.14, w * 1.02); win.rotation.y = b.rotation.y; G0.add(win);
      }
    }

    /* the moon she sits on */
    const moon = new THREE.Mesh(new THREE.SphereGeometry(6.2, 32, 22), new THREE.MeshStandardMaterial({ color: 0xf0ecff, emissive: 0x7d6cd4, emissiveIntensity: 0.65, roughness: 0.85 }));
    moon.position.set(-4, 9.5, -20); G0.add(moon);
    const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(7.6, 22, 16), new THREE.MeshBasicMaterial({ color: 0x9a8cff, transparent: true, opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false }));
    moonGlow.position.copy(moon.position); G0.add(moonGlow);
    const moonLight = new THREE.PointLight(0xc8bcff, 2.6, 90); moonLight.position.set(-2, 8, -16); G0.add(moonLight);

    /* drifting stardust */
    const motes = [];
    const moteMat = new THREE.MeshBasicMaterial({ color: 0xcfe0ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
    for (let k = 0; k < 60; k++) {
      const m = new THREE.Mesh(GS, moteMat);
      m.scale.setScalar(0.03 + Math.random() * 0.05);
      m.userData = { a: Math.random() * 6.283, r: 3 + Math.random() * 16, y: Math.random() * 10, s: 0.15 + Math.random() * 0.4 };
      G0.add(m); motes.push(m);
    }

    /* characters */
    const god = T.mkGoddess(2.05);
    god.position.set(0, 2.6, -4.6);
    T.STG.add(god);
    const pedestal = new THREE.Mesh(GO, new THREE.MeshBasicMaterial({ color: 0xbbaaff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending }));
    pedestal.scale.set(0.9, 1.2, 0.9); pedestal.position.set(0, 1.3, -4.6); T.STG.add(pedestal);

    const hero = T.mkPlayer(1.75, 0x6f8fd0);
    hero.position.set(0, 0, 2.6);
    hero.rotation.y = Math.PI;
    T.STG.add(hero);

    /* constellation that forms at the very end */
    const constel = new THREE.Group(); T.STG.add(constel);
    const cStars = [];
    const heart = [];
    for (let k = 0; k < 26; k++) {
      const u = (k / 26) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(u), 3);
      const hy = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
      heart.push([hx * 0.55, hy * 0.55 + 13, -34]);
    }
    for (let k = 0; k < 40; k++) {
      const st = new THREE.Mesh(GS, new THREE.MeshBasicMaterial({ color: 0xfff2c8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
      st.scale.setScalar(0.12);
      const p = k < 26 ? heart[k] : [Math.cos(k * 2.1) * 18, 6 + Math.sin(k * 1.7) * 8, -32 - Math.random() * 8];
      st.position.set(p[0] + (k < 26 ? 0 : Math.random() * 8 - 4), p[1], p[2]);
      constel.add(st); cStars.push(st);
    }

    C.mods = { god, hero, moon, moonGlow, constel, cStars, motes, inlay, inlay2, ring, moonLight };
    return C.mods;
  }

  /* ---------------------------------------------------------
     MATCH 1 — THE JOURNEY
     --------------------------------------------------------- */
  function startJourney() {
    T.clearStage();
    T.stageBase({ a: 0x02040c, b: 0x0b1230, near: 90, far: 320, sun: 0xffe0b0, si: 1.1, amb: 0x2a3550, ai: 0.7 });
    const earth = new THREE.Group(); T.STG.add(earth);
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(16, 40, 28), new THREE.MeshStandardMaterial({ color: 0x2b4f8c, roughness: 0.85, emissive: 0x0a1a34 }));
    earth.add(sphere);
    for (let k = 0; k < 22; k++) {
      const a = Math.random() * 6.283, b = (Math.random() - 0.5) * 2.2;
      const p = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 1 }));
      p.position.set(Math.cos(a) * Math.cos(b) * 15.6, Math.sin(b) * 15.6, Math.sin(a) * Math.cos(b) * 15.6);
      p.scale.set(2 + Math.random() * 4, 1.4 + Math.random() * 2.4, 2 + Math.random() * 4);
      p.lookAt(0, 0, 0); earth.add(p);
    }
    const atmo = new THREE.Mesh(new THREE.SphereGeometry(17.4, 30, 22), new THREE.MeshBasicMaterial({ color: 0x6aa8ff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
    earth.add(atmo);
    earth.position.set(0, -34, -6);

    const hero = T.mkPlayer(1.7, 0x6f8fd0);
    hero.position.set(0, 0, 0);
    hero.rotation.y = Math.PI;
    T.STG.add(hero);
    const trail = new THREE.Group(); T.STG.add(trail);
    const streaks = [];
    for (let k = 0; k < 40; k++) {
      const s = new THREE.Mesh(GX, new THREE.MeshBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
      s.scale.set(0.03, 0.03, 1.4 + Math.random() * 3);
      s.position.set((Math.random() - 0.5) * 26, Math.random() * 60 - 10, (Math.random() - 0.5) * 26);
      s.userData = { sp: 20 + Math.random() * 50 };
      trail.add(s); streaks.push(s);
    }
    /* distant city, revealed at the end */
    const city = new THREE.Group(); city.position.set(0, 34, -150); T.STG.add(city);
    const cityRock = new THREE.Mesh(new THREE.ConeGeometry(9, 9, 7), new THREE.MeshStandardMaterial({ color: 0x1a1d3a, roughness: 1 }));
    cityRock.rotation.x = Math.PI; cityRock.position.y = -5; city.add(cityRock);
    const cityTop = new THREE.Mesh(new THREE.CylinderGeometry(9, 8.4, 1.2, 24), new THREE.MeshStandardMaterial({ color: 0x232a58, emissive: 0x141a44 }));
    city.add(cityTop);
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * 6.283, r = Math.random() * 7;
      const h = 1 + Math.random() * 5;
      const b = new THREE.Mesh(GX, new THREE.MeshStandardMaterial({ color: 0x1c2350, emissive: 0x28306a, emissiveIntensity: 0.9 }));
      b.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); b.scale.set(0.6 + Math.random(), h, 0.6 + Math.random()); city.add(b);
    }
    const cityGlow = new THREE.Mesh(new THREE.SphereGeometry(13, 20, 14), new THREE.MeshBasicMaterial({ color: 0x8fb6ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    city.add(cityGlow);
    city.visible = false;

    C.mods = { earth, hero, streaks, city, cityGlow };
    C.auto = true; C.tick = journeyTick;
    C.beats = [
      { dur: 5.0, who: "NARRATOR", text: "The city below shrinks to a rumour." },
      { dur: 4.6, who: "NARRATOR", text: "The sky turns from blue, to indigo, to something with no name." },
      { dur: 4.6, who: "NARRATOR", text: "Earth becomes a pale coin at your back — and then not even that." },
      { dur: 5.4, who: "NARRATOR", text: "Ahead, a city that no human hand has ever touched." }
    ];
    C.startBeat = 0;
    C.onEnd = () => {
      T.setTitle("", "STARLIGHT CITY", "ISLAND 1");
      setTimeout(() => { if (C.active) endCine(); }, 2600);
    };
    T.music("city");
  }

  function journeyTick(dt, t) {
    const M = C.mods;
    const e = Math.min(t / 20, 1);
    M.hero.position.y = t * 4.2;
    const sway = Math.sin(t * 0.9) * 0.12;
    M.hero.position.x = sway;
    M.hero.rotation.z = Math.sin(t * 0.8) * 0.06;
    const P = M.hero.userData.P;
    P.la.rotation.x = -2.4 + Math.sin(t * 2) * 0.1;
    P.ra.rotation.x = -2.4 - Math.sin(t * 2) * 0.1;
    P.ll.rotation.x = 0.16 + Math.sin(t * 1.7) * 0.1;
    P.rl.rotation.x = -0.1 - Math.sin(t * 1.7) * 0.1;
    P.hd.rotation.x = -0.18;
    /* earth recedes */
    const sc = Math.max(0.16, 1 - t / 17);
    M.earth.scale.setScalar(sc);
    M.earth.position.set(0, -34 - t * 1.6, -6 - t * 0.7);
    /* streaks */
    M.streaks.forEach((s, i) => {
      s.position.y -= s.userData.sp * dt;
      if (s.position.y < -10) s.position.y = 45;
      s.material.opacity = Math.min(1, t / 4) * (0.25 + Math.random() * 0.35);
    });
    /* camera trails the flier */
    const cy = M.hero.position.y - 3.2;
    cam.position.set(Math.sin(t * 0.4) * 1.6, cy + 1.4, 7.4);
    cam.lookAt(M.hero.position.x, M.hero.position.y + 0.6, 0);
    /* sky darkens */
    const k = Math.min(1, t / 12);
    sky.material.uniforms.b.value.setHex(0x0b1230).lerp(new THREE.Color(0x050714), k);
    /* the city appears */
    if (t > 12) {
      M.city.visible = true;
      const a = Math.min(1, (t - 12) / 4);
      M.city.position.z = -150 + (1 - a) * 40;
      M.city.position.y = 34 - a * 10;
      M.city.scale.setScalar(0.6 + a * 0.55);
      M.cityGlow.material.opacity = a * 0.35;
      cam.lookAt(M.city.position.x, M.city.position.y + 2, M.city.position.z);
    }
    T.keepper();
  }

  /* ---------------------------------------------------------
     the conversation scenes (6, 7, 9)
     --------------------------------------------------------- */
  function startTalk(kind) {
    const M = citySet();
    C.auto = false;
    C.tick = talkTick;
    if (kind === "6") { C.beats = TALK6; C.onEnd = endTalk; T.music("city"); }
    else if (kind === "7") { C.beats = TALK7; C.onEnd = endTalk; T.music("space"); }
    else { C.beats = TALK9; C.onEnd = endTalk; T.music("city"); }
    T.camSnap(C.beats[0].cam, C.beats[0].look);
  }

  function talkTick(dt, t) {
    const M = C.mods;
    if (!M || !M.god) return;
    const b = C.beats[C.b] || {};
    T.pose(M.god, t, { pose: b.gpose || "idle", base: M.god.userData.sat ? 2.6 : 2.6, float: 0.09, sit: !!b.gsit, kneel: !!b.gkneel });
    T.pose(M.hero, t, { pose: b.hpose || "idle", base: 0, float: 0.02 });
    M.god.rotation.y = b.gy !== undefined ? b.gy : 0;
    M.hero.rotation.y = Math.PI + (b.hy || 0);
    /* stardust */
    M.motes.forEach((m, i) => {
      const u = m.userData;
      m.position.set(Math.cos(u.a + t * u.s * 0.3) * u.r, 0.4 + u.y * 0.5 + Math.sin(t * 0.7 + i) * 0.6, Math.sin(u.a + t * u.s * 0.3) * u.r);
      m.material.opacity = 0.25 + Math.sin(t * 1.6 + i) * 0.2;
    });
    M.ring.rotation.z = t * 0.25;
    M.inlay.rotation.z = t * 0.08;
    M.inlay2.rotation.z = -t * 0.12;
    M.moonLight.intensity = 2.2 + Math.sin(t * 0.8) * 0.5;
    /* constellation reveal at the end of match 9 */
    const rev = b.reveal || 0;
    M.constel.visible = rev > 0;
    if (rev > 0) M.cStars.forEach((s, i) => { s.material.opacity = Math.max(0, Math.min(1, (rev * 26 - i) * 0.6)); });
    /* the goddess descends for the handshake */
    if (b.descend !== undefined) {
      M.god.position.y = 2.6 - b.descend * 2.0;
      M.god.position.z = -4.6 + b.descend * 2.4;
    }
    if (b.bright) {
      sun.intensity = 0.9 + b.bright * 1.5;
      amb.intensity = 1 + b.bright * 0.6;
      M.moonGlow.material.opacity = 0.13 + b.bright * 0.2;
    } else { sun.intensity = 0.9; amb.intensity = 1; M.moonGlow.material.opacity = 0.13; }
    if (b.cityDim) { M.inlay3 && (M.inlay3.material.opacity = 0.2); }
    T.keepper();
  }

  /* ---- writing ---- */
  const CAMS = {
    wide: { cam: [11, 6.4, 12.5], look: [0, 2.4, -1.6] },
    heroBack: { cam: [2.4, 2.5, 7.4], look: [0, 2.5, -4.6] },
    godClose: { cam: [2.1, 3.6, 0.4], look: [0, 3.1, -4.6] },
    godSide: { cam: [-4.2, 3.2, 1.2], look: [0, 2.9, -4.6] },
    heroLow: { cam: [0.9, 1.0, 6.6], look: [0, 2.0, -3.2] },
    sky: { cam: [2, 5.6, 9.0], look: [-6, 12, -26] },
    together: { cam: [7.5, 3.2, 8.5], look: [0, 1.6, -2.2] }
  };
  function beat(camKey, who, text, extra) {
    return Object.assign({ cam: CAMS[camKey].cam, look: CAMS[camKey].look, who, text }, extra || {});
  }
  const N = (k, t) => beat(k, "NARRATOR", t);

  const TALK6 = [
    N("wide", "The air out here is thin and cold — and yet you are breathing as though it were a summer evening."),
    beat("godSide", "GODDESS OF THE STARS", "Breathe, little spark. I asked the void to hold its breath for you. It owes me a favour.", { gpose: "speak", gy: -0.3 }),
    beat("heroBack", "PROTAGONIST", "...You're the Goddess of the Stars.", { hpose: "open" }),
    beat("godClose", "GODDESS OF THE STARS", "I am what your world calls one. Sit. Nothing here can hurt you except my questions.", { gpose: "point", gy: 0.2 }),
    N("sky", "Behind her, a constellation turns over like a sleeper. Ten thousand years of watching, and she still does not look tired."),
    beat("godClose", "GODDESS OF THE STARS", "I have watched your kind since the first fire was stolen. And there is one thing I have never understood.", { gpose: "speak" }),
    beat("godClose", "GODDESS OF THE STARS", "Why isn't humanity simply made up of bad people?", { gpose: "point", gy: 0.35 }),
    beat("heroLow", "PROTAGONIST", "Because it isn't that simple.", { hpose: "open" }),
    beat("godSide", "GODDESS OF THE STARS", "Everything is simple from up here. Your species has power enough to end itself a thousand times, and mercy enough to keep choosing not to. Which one is the accident?", { gpose: "speak", gy: -0.2 }),
    beat("heroBack", "PROTAGONIST", "Neither. We're not good because we're weak. We're good because we choose it. Every day. Some of us fail — and we get up and choose it again.", { hpose: "point" }),
    beat("godClose", "GODDESS OF THE STARS", "I have seen a mother give her last bread to a stranger's child. I have also seen the same hands that fed a city burn it. Which one is true?", { gpose: "sad" }),
    beat("heroLow", "PROTAGONIST", "Both. That's what being human is. You don't get one without the other.", { hpose: "open" }),
    beat("godSide", "GODDESS OF THE STARS", "...I have burned civilisations for less arrogance than that answer.", { gpose: "sad", gy: 0.15 }),
    beat("godClose", "GODDESS OF THE STARS", "You are all so brief. And yet you spend your briefness on each other. I find that unforgivable. And beautiful.", { gpose: "speak" }),
    N("wide", "For the first time in her existence, the Goddess of the Stars looks uncertain.")
  ];

  const TALK7 = [
    beat("godClose", "GODDESS OF THE STARS", "You're still here. Most mortals would have run. Or died. You do that a lot, I've noticed.", { gpose: "speak" }),
    beat("heroBack", "PROTAGONIST", "You didn't answer me. About the bread.", { hpose: "point" }),
    beat("godSide", "GODDESS OF THE STARS", "I did not. I was busy being magnificent.", { gpose: "proud", gy: -0.2 }),
    beat("godClose", "GODDESS OF THE STARS", "Fine. The truth is I don't understand kindness, because it makes no sense. A star does not give away its light.", { gpose: "speak" }),
    beat("heroLow", "PROTAGONIST", "A star doesn't choose to either.", { hpose: "open" }),
    beat("godClose", "GODDESS OF THE STARS", "…Oh. That's annoyingly clever.", { gpose: "laugh", gy: 0.25 }),
    N("sky", "The city below dims, one district at a time, as though listening."),
    beat("godSide", "GODDESS OF THE STARS", "I have a confession, little spark. Before you arrived, I was going to end your world. Not out of hate. Out of boredom.", { gpose: "sad", gy: 0.1 }),
    beat("heroBack", "PROTAGONIST", "And now?", { hpose: "idle" }),
    beat("godClose", "GODDESS OF THE STARS", "Now I want to see what it does next. Do you understand what a dangerous gift that is?", { gpose: "speak" }),
    beat("godSide", "GODDESS OF THE STARS", "So I am going to ask you to fight me. Not to kill me — to prove that a small thing can stand in front of a large one and refuse to run.", { gpose: "point", gy: -0.3 }),
    beat("heroLow", "PROTAGONIST", "And if I lose?", { hpose: "idle" }),
    beat("godClose", "GODDESS OF THE STARS", "Then I will have my answer, and I will be very sad about it. Briefly. I'm immortal — it won't last.", { gpose: "laugh" }),
    N("wide", "The moon beneath her feet begins to glow. Far below, the city holds its light like a held breath.")
  ];

  const TALK9 = [
    N("wide", "The stars settle. The Goddess of the Stars lowers herself onto the moon beside you, and for the first time she looks small."),
    beat("godClose", "GODDESS OF THE STARS", "You dented my favourite moon.", { gpose: "speak", gsit: 1, descend: 1 }),
    beat("heroBack", "PROTAGONIST", "You yawned a supernova at me.", { hpose: "open" }),
    beat("godClose", "GODDESS OF THE STARS", "And yet here you are. Breathing. Annoying me.", { gpose: "laugh", gsit: 1, descend: 1 }),
    N("together", "She is quiet for a while. Somewhere below, a city that was almost ended keeps its lights on."),
    beat("godSide", "GODDESS OF THE STARS", "I have a name, you know. Your kind will call it something else. But you may call me Ilyra.", { gpose: "speak", gsit: 1, descend: 1 }),
    beat("heroLow", "PROTAGONIST", "Ilyra.", { hpose: "idle" }),
    beat("godClose", "ILYRA", "Say it again and I'll reconsider the friendship thing.", { gpose: "laugh", gsit: 1, descend: 1 }),
    N("wide", "She laughs — a sound like a system being born — and for a moment Starlight City is brighter than it has been in ten thousand years."),
    beat("godClose", "ILYRA", "I will be watching you, little spark. Not as a judge. As a friend.", { gpose: "open", descend: 1, bright: 1, reveal: 1 }),
    beat("together", "ILYRA", "Now go home. And be good. Or don't. I'll still be here.", { gpose: "open", descend: 1, bright: 1, reveal: 2 })
  ];

  /* ---------------------------------------------------------
     playback
     --------------------------------------------------------- */
  T.playCine = function (i) {
    C.active = 0;
    T.transition(() => {
      C.active = 1; C.i = i; C.b = 0; C.t = 0; C.acc = 0;
      T.skipFn = () => { C.onEnd = null; C.auto = false; endCine(); };
      T.mode = "cine"; G.st = "story"; G.story = 0;
      try { document.exitPointerLock(); } catch (e) {}
      $i("menu").style.display = "none";
      T.hideAll(); T.hideDlg(); T.setTitle("", "", "");
      $i("stCine").classList.add("on");
      T.hudVis(false);
      if (i === 0) startJourney();
      else if (i === 5) startTalk("6");
      else if (i === 6) startTalk("7");
      else startTalk("9");
      T.setFrame(frame);
      applyBeat();
    });
  };

  function applyBeat() {
    const b = C.beats[C.b];
    if (!b) return;
    if (b.text) T.say(b.who || "", b.text);
    if (b.cam) { /* lerped in frame */ }
  }
  function nextBeat() {
    if (T.skipType()) return; /* first click finishes the line */
    C.b++; C.acc = 0;
    const b = C.beats[C.b];
    if (!b) { C.auto = false; if (C.onEnd) { const f = C.onEnd; C.onEnd = null; f(); } return; }
    applyBeat();
    T.sfx(420, 0.05, "sine");
  }
  function frame(dt) {
    if (!C.active) return;
    C.t += dt; C.acc += dt;
    const b = C.beats[C.b];
    if (C.tick) C.tick(dt, C.t * (C.auto ? 1 : 0) + (C.auto ? 0 : C.t));
    if (!C.auto && b && b.cam) T.camTo(b.cam, b.look, dt, 1.5);
    if (C.auto && b && C.acc >= b.dur) { C.acc = 0; C.b++; const n = C.beats[C.b]; if (!n) { C.auto = false; if (C.onEnd) { const f = C.onEnd; C.onEnd = null; f(); } } else applyBeat(); }
  }

  function endTalk() {
    T.hideDlg();
    T.setTitle("", "", "");
    endCine();
  }
  function endCine() {
    if (!C.active) return;
    C.active = 0;
    T.skipFn = null;
    T.hideDlg();
    T.setTitle("", "", "");
    const i = C.i;
    const el = $i("stReward");
    el.innerHTML = `<div class="st-rw" style="--c:#a8c8ff"><div class="st-rw-k">MATCH ${i + 1} COMPLETE</div>
      <div class="st-rw-name">${T.ENC[i].t}</div>
      <p class="st-rw-d">${i === 0 ? "You have arrived in Starlight City." : i === 5 ? "She has your answer. She is not finished with you." : i === 6 ? "The trial has been set." : "Starlight City is at peace."}</p>
      <button class="st-btn" onclick="stCineNext()">CONTINUE</button></div>`;
    el.classList.add("on");
    T.setFrame(null);
    T.stopMusic();
    T.sfx(660, 0.3, "sine"); setTimeout(() => T.sfx(990, 0.4, "triangle"), 160);
    window.stCineNext = function () {
      el.classList.remove("on");
      T.reward("concept", () => T.finish(i));
    };
  }

  /* advance on click / space */
  document.addEventListener("click", (e) => {
    if (!C.active || C.auto) return;
    if (e.target && e.target.closest && e.target.closest("button")) return;
    $i("stReward").classList.contains("on") || nextBeat();
  });
  window.addEventListener("keydown", (e) => {
    if (!C.active) return;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (!C.auto) nextBeat(); }
  });
})();
</script>
<script>
/* eslint-disable */
/* ============================================================
   ABSTRACT CONCEPTS — STORY MODE · BATTLES + GODDESS BOSS
   Matches 2, 3, 4, 5 and 8.
   ============================================================ */
(function () {
  const T = window.ACStory;
  if (!T || T.battleReady) return;
  T.battleReady = 1;
  const $i = (id) => document.getElementById(id);
  const S = T.S;
  const rand = (a, b) => a + Math.random() * (b - a);

  /* =======================================================
     shared battle setup
     ======================================================= */
  function armPlayer() {
    document.exitPointerLock && document.exitPointerLock();
    G.st = "story";
    const wasPractice = G.practice;
    G.practice = 1;
    G.en.slice().forEach((x) => { x.nocmb = 1; kill(x); });
    G.practice = wasPractice;
    G.pr.forEach((p) => sc.remove(p.m)); G.pr = [];
    try { chaosEnd(); } catch (e) {}
    try { bossFx(); } catch (e) {}
    Object.values(W).forEach((w) => { w.stolen = 0; });
    const loadout = S.wep.length ? S.wep.slice() : ["Pistols of Destruction"];
    if (!loadout.includes("Pistols of Destruction")) loadout.unshift("Pistols of Destruction");
    Object.assign(G, {
      hp: 150, mx: 150, wep: loadout.slice(0, 10), con: S.con.slice(0, 3), gone: [], cur: 0,
      wcd: {}, ccd: {}, use: {}, fz: 0, hope: 1, pot: 0, hap: 0, sad: 0, jam: 0, cj: 0, perc: 0,
      rev: 0, mis: 0, shuf: 0, fire: 0, spec: 0, luck: 0, stunP: 0, dot: 0, dest: null, vy: 0,
      cmb: 0, cmbT: 0, bonus: 0, rwP: 0, god: 0, bi: null, ovl: 0, inv: 0, dcd: 0, dsh: 0,
      ech: 0, bell: 0, bellT: -99, lastW: null, hitT: -99, tpOn: 0, tpT: 0, slowP: 0, gl: 0,
      void: 0, dsW: [], dead: [], _vmn: null, w: 1, tot: 0, practice: 0, rush: 0, story: 1, storyDirty: 1, grav: 25
    });
    if (typeof prE !== "undefined" && prE) prE.style.display = "none";
    if (typeof rushE !== "undefined" && rushE) rushE.style.display = "none";
    vmBuild();
  }

  function placeEnemies(list, hpm) {
    let n = 0;
    const total = list.reduce((a, x) => a + x[1], 0);
    list.forEach(([type, count]) => {
      for (let k = 0; k < count; k++) {
        const a = (n / Math.max(1, total)) * 6.283 + 0.4;
        const r = 15 + (n % 4) * 4;
        spawn(type, Math.cos(a) * r, Math.sin(a) * r, { hpm: hpm });
        n++;
      }
    });
    G.tot = G.en.length;
    G.en.forEach((e) => { e.hp *= 1; e.mhp = e.hp; });
  }

  /* =======================================================
     regular battles
     ======================================================= */
  const SETS = {
    2: [["grunt", 3], ["archer", 3]],
    3: [["wisp", 3], ["archer", 2], ["runner", 2], ["blinker", 1]],
    4: [["gravitor", 1], ["timekeeper", 1], ["cryomancer", 1], ["thunderer", 1], ["protector", 1], ["grunt", 3]],
    5: [["mage", 1], ["sniper", 2], ["brute", 1], ["charger", 1], ["healer", 1], ["wisp", 2], ["blinker", 1], ["gravitor", 1]]
  };

  T.armPlayer = () => armPlayer();
  T.placeEnemies = (a, b) => placeEnemies(a, b);
  T.playBattle = function (i) {
    T.curIdx = i;
    const e = T.ENC[i];
    T.hideAll(); T.hideDlg(); T.setTitle("", "", "");
    $i("menu").style.display = "none";
    T.fadeEl.classList.add("on");
    document.exitPointerLock && document.exitPointerLock();
    armPlayer();
    props.visible = true; ground.visible = true; rim.visible = true;
    T.hudVis(true);
    if (e.k === "boss") {
      T.mode = "boss";
      bossArena();
      setTimeout(() => T.fadeEl.classList.remove("on"), 70);
      return;
    }
    T.mode = "battle";
    setMap(1);
    T.stars = 0;
    placeEnemies(SETS[e.id] || [["grunt", 3]], 0.75 + e.id * 0.09);
    cam.position.set(0, 1.7, 0);
    G.yaw = 0; G.pit = 0; cam.rotation.set(0, 0, 0);
    msg("MATCH " + e.id + " — " + e.t);
    announce(e.t, "#8fc6ff");
    T.music("space");
    T.setFrame(battleFrame);
    setTimeout(() => T.fadeEl.classList.remove("on"), 70);
    setTimeout(() => { try { play(); } catch (er) {} }, 40);
  };

  function battleFrame(dt) {
    if (G.st !== "play") { T.keepper(); return; }
    T.stars = (T.stars || 0) + dt;
    if (T.mode === "battle" && T.curIdx === 2 && T.stars > 2.1) { T.stars = 0; starFall(); }
    if (T.mode === "boss") bossFrame(dt);
    T.keepper();
  }

  /* star-themed environmental hazard for MATCH 3 */
  function starFall() {
    const px = cam.position.x + rand(-16, 16), pz = cam.position.z + rand(-16, 16);
    const m = new THREE.Mesh(GO, new THREE.MeshBasicMaterial({ color: 0xfff0b0 }));
    m.scale.setScalar(0.55);
    const glow = new THREE.Mesh(GS, new THREE.MeshBasicMaterial({ color: 0xffd070, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(2.2); m.add(glow);
    m.position.set(px, 34, pz); sc.add(m);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 6, 34), new THREE.MeshBasicMaterial({ color: 0xffaa55, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending }));
    ring.rotation.x = 1.57; ring.position.set(px, 0.1, pz); sc.add(ring);
    const fall = { m, ring, y: 34, done: 0, t: 0 };
    const tick = setInterval(() => {
      fall.t += 0.016;
      fall.y -= 1.5 + fall.t * 2;
      m.position.y = fall.y;
      m.rotation.x += 0.2; m.rotation.z += 0.15;
      ring.scale.setScalar(1 + Math.sin(fall.t * 12) * 0.15);
      if (fall.y <= 1) {
        clearInterval(tick);
        sc.remove(m); sc.remove(ring);
        puff(new THREE.Vector3(px, 0.6, pz), 0xffaa44, 26);
        try { ringFx(new THREE.Vector3(px, 0.2, pz), 0xffcc66, 6, 0.5); } catch (e) {}
        if (Math.hypot(cam.position.x - px, cam.position.z - pz) < 4) hurt(16);
        alive().filter((x) => Math.hypot(x.m.position.x - px, x.m.position.z - pz) < 4).forEach((x) => dmg(x, 40, "x"));
        for (let k = 0; k < 6; k++) {
          const sh = new THREE.Mesh(GO, new THREE.MeshBasicMaterial({ color: 0xffe08a }));
          sh.scale.setScalar(0.16); sh.position.set(px, 0.6, pz); sc.add(sh);
          G.fx.push({ m: sh, v: new THREE.Vector3(rand(-6, 6), rand(3, 9), rand(-6, 6)), t: 0.8 });
        }
      }
    }, 16);
  }

  /* =======================================================
     the Goddess of the Stars — arena
     ======================================================= */
  /* phase starts idle: the boss intro handlers must stay dead until the fight actually begins */
  const B = { god: null, t: 0, cd: 3, phase: "idle", rain: [], yawn: null, queue: [], rage: 0, pose: "idle", lines: 0 };
  T.BOSS = B;

  function meteor(x, y, z, r) {
    plat(x, y, z, r, 0x3a3f66);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.98, 0.07, 6, 44), new THREE.MeshBasicMaterial({ color: 0x8fd0ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
    ring.rotation.x = 1.57; ring.position.set(x, y + 0.04, z); sc.add(ring);
    for (let k = 0; k < 3; k++) {
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r * 0.34, 0), new THREE.MeshStandardMaterial({ color: 0x2a2e4e, roughness: 0.9, flatShading: true }));
      const a = Math.random() * 6.28;
      rock.position.set(x + Math.cos(a) * r * 0.55, y - 0.35, z + Math.sin(a) * r * 0.55);
      rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      sc.add(rock);
    }
    const mt = { x, y, z, r, ring };
    if (T.arenaExtra) T.arenaExtra.push(ring);
    if (!T.meteors) T.meteors = [];
    T.meteors.push(mt);
    return mt;
  }

  function bossArena() {
    setMap(1);
    (T.arenaExtra || []).forEach((o) => { try { sc.remove(o); } catch (e) {} });
    T.arenaExtra = [];
    T.meteors = [];
    ground.visible = false;
    props.visible = false;
    G.col = [];
    G.grav = 15;
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * 6.283, rr = 52 + (k % 3) * 18;
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + (k % 4), 0), new THREE.MeshStandardMaterial({ color: 0x171a30, emissive: 0x0a0c1e, roughness: 1, flatShading: true }));
      rock.position.set(Math.cos(a) * rr, 4 + (k % 5) * 6, Math.sin(a) * rr);
      sc.add(rock); T.arenaExtra.push(rock);
    }
    /* the moon */
    const moon = new THREE.Mesh(new THREE.SphereGeometry(6, 34, 24), new THREE.MeshStandardMaterial({ color: 0xe6e2ff, emissive: 0x6b5cd0, emissiveIntensity: 0.7, roughness: 0.85 }));
    moon.position.set(0, 0.4, 0); sc.add(moon);
    const mglow = new THREE.Mesh(new THREE.SphereGeometry(7.4, 22, 16), new THREE.MeshBasicMaterial({ color: 0x9a8cff, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }));
    mglow.position.copy(moon.position); sc.add(mglow);
    T.moon = moon; T.mglow = mglow;
    const ml = new THREE.PointLight(0xc8bcff, 2.6, 120); ml.position.set(0, 7, 0); sc.add(ml);
    T.arenaExtra.push(moon, mglow, ml);
    B.mglow = mglow;
    /* floating meteors around her */
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * 6.283 + 0.25;
      meteor(Math.cos(a) * 13.5, 4.9 + Math.sin(k * 1.9) * 1.9, Math.sin(a) * 13.5, 3.5);
    }
    meteor(-8.5, 6.4, -3.2, 2.7);
    meteor(8.6, 5.2, -3.6, 2.7);
    meteor(0.4, 4.6, 9.4, 2.6);
    /* her */
    const g = T.mkGoddess(2.6);
    g.position.set(0, 7.2, 0);
    sc.add(g);
    const e = {
      t: "goddess", b: 6, mini: 1, goddess: 1, m: g, sc: 2.6, hp: 2000, mhp: 2000, sp: 0, dm: 18,
      d: {}, cd: 3, forgot: {}, slow: 0, stun: 0, sleep: 0, sil: 0, base: 7.2, mat: g.userData.mat, lx: 0, lz: 0
    };
    G.en.push(e);
    B.god = e; B.phase = "intro"; B.t = 0; B.cd = 3; B.rain = []; B.yawn = null; B.queue = []; B.fx = []; B.last = ""; B.rage = 0; B.pose = "idle"; B.lines = 0;
    G.bi = e;
    cam.position.set(18, 7.4, 18);
    cam.lookAt(0, 7, 0);
    G.yaw = Math.atan2(18, 18) + Math.PI;
    G.pit = -0.1;
    bossIntro();
  }

  /* --- intro --- */
  function bossIntro() {
    T.mode = "boss";
    G.st = "story";
    T.music("space");
    T.setTitle("MAJOR BOSS", "GODDESS OF THE STARS", "2,000 HP");
    $i("stCine").classList.add("on");
    T.skipFn = () => startFight();
    T.setFrame(introFrame);
    T.sfx(90, 1.4, "sawtooth");
    setTimeout(() => { if (B.phase === "intro") { T.setTitle("", "", ""); bossLine(0); } }, 3400);
  }
  const BOSS_LINES = [
    "You may find it hard to breathe out here. I have paused that necessity for you — it seemed impolite to let you suffocate before the interesting part.",
    "I am going to throw stars at you now. Do try to be worth the effort."
  ];
  function bossLine(n) {
    B.lines = n;
    T.say("GODDESS OF THE STARS", BOSS_LINES[n]);
  }
  function introFrame(dt) {
    B.t += dt;
    const a = Math.atan2(18, 18) + B.t * 0.22 + Math.PI;
    cam.position.set(Math.sin(a) * 24, 8.5 + Math.sin(B.t * 0.5) * 1.2, Math.cos(a) * 24);
    cam.lookAt(0, 7, 0);
    if (B.god) T.pose(B.god.m, B.t, { pose: B.t > 3 ? "open" : "idle", base: 7.2, float: 0.08, sit: true });
    T.keepper();
  }

  function startFight() {
    if (B.phase !== "intro" || !T.meteors || !T.meteors.length) return;
    T.skipFn = null;
    T.hideDlg();
    $i("stCine").classList.remove("on");
    T.setFrame(battleFrame);
    B.phase = "fight";
    B.cd = 3.6;
    const m = T.meteors[0];
    cam.position.set(m.x, m.y + 1.7, m.z);
    G.vy = 0;
    G.yaw = Math.atan2(-m.x, -m.z);
    G.pit = -0.1;
    cam.rotation.set(G.pit, G.yaw, 0);
    play();
    msg("DESTROY THE GODDESS — 2000 HP");
  }
  window.stBossNext = function () {
    if (B.lines === 0) { bossLine(1); return; }
    startFight();
  };
  document.addEventListener("click", (e) => {
    if (B.phase !== "intro" || !B.god) return;
    if (e.target && e.target.closest && e.target.closest("button")) return;
    if (document.getElementById("stDlg").style.display !== "block") return;
    if (T.skipType()) return;
    if (B.lines === 0) bossLine(1); else startFight();
  });

  /* --- attacks (retuned: rarer, slower, easier to read, more forgiving) --- */
  const STAR_HR = 0.6;   /* player hurtbox against her projectiles (default 1.1) — they LOOK bigger than they hit */
  function fxAdd(m, life, grow) { B.fx = B.fx || []; B.fx.push({ m, t: 0, life, grow }); sc.add(m); }
  /* a bright charge-up at her hands so every attack is telegraphed before it fires */
  function telegraph(col, life) {
    const e = B.god; if (!e || !T.glow) return;
    const s = T.glow(col || 0xfff2b8, 1, 0.95);
    s.position.copy(e.m.position); s.position.y += 3.1;
    fxAdd(s, life || 0.7, 9);
    T.sfx(380, 0.25, "sine");
  }
  /* a star you can actually read against the dark: big warm core, wide halo, and a trailing comet tail */
  function mkStar(scale, dir) {
    const m = new THREE.Mesh(GO, new THREE.MeshBasicMaterial({ color: 0xfff6c8 }));
    m.scale.setScalar(scale);
    if (T.glow) {
      const halo = T.glow(0xffb040, 4.6, 0.8); m.add(halo);
      const halo2 = T.glow(0xfff0a0, 2.6, 0.95); m.add(halo2);
      for (let k = 1; k <= 4; k++) {
        const tl = T.glow(0xffa030, 3.4 - k * 0.55, 0.6 - k * 0.12);
        tl.position.set(-dir.x * k * 1.25 / scale, -dir.y * k * 1.25 / scale, -dir.z * k * 1.25 / scale);
        m.add(tl);
      }
    }
    return m;
  }
  function starShot(spread, speed, dmgV) {
    const e = B.god; if (!e) return;
    const from = e.m.position.clone(); from.y += 2.6;
    const dir = cam.position.clone().sub(from).normalize();
    if (spread) { dir.x += spread; dir.y += spread * 0.2; dir.z += spread * 0.6; dir.normalize(); }
    const m = mkStar(0.95, dir);
    m.position.copy(from); sc.add(m);
    G.pr.push({ m, v: dir.clone().multiplyScalar(speed), d: dmgV, o: null, t: 0, hr: STAR_HR });
    T.sfx(520, 0.07, "triangle");
  }
  function atkStar() {
    B.pose = "point";
    telegraph(0xfff2b8, 0.8);
    const sp = B.rage ? 17 : 14, n = 3;

    setTimeout(() => { B.pose = "idle"; }, 2200);
  }
  function atkVolley() {
    B.pose = "open";
    telegraph(0xffd88a, 0.9);
    msg("STAR BURST — SLIP BETWEEN THE STARS");
    B.queue.push({ t: 0.9, fn: () => {
      const e = B.god; if (!e) return;
      const N = 10, off = Math.random() * 6.283;
      for (let k = 0; k < N; k++) {
        const a = off + (k / N) * 6.283;
        const v = new THREE.Vector3(Math.cos(a) * 0.85, -0.2, Math.sin(a) * 0.85).normalize();
        const m = mkStar(0.8, v);
        m.position.set(Math.cos(a) * 1.6, 9.2 + Math.sin(a) * 0.4, Math.sin(a) * 1.6);
        sc.add(m);
        G.pr.push({ m, v: v.multiplyScalar(B.rage ? 11 : 9), d: 8, o: null, t: 0, hr: STAR_HR });
      }
      T.sfx(300, 0.4, "sawtooth");
    } });
    setTimeout(() => { B.pose = "idle"; }, 2200);
  }
  function onMeteor() {
    let best = null, bd = 1e9;
    const y = cam.position.y - 1.7;
    (T.meteors || []).forEach((m) => {
      const d = Math.hypot(cam.position.x - m.x, cam.position.z - m.z);
      if (d < m.r + 0.6 && Math.abs(y - m.y) < 1.2 && d < bd) { bd = d; best = m; }
    });
    return best;
  }
  function atkRain() {
    B.pose = "point";
    const T0 = B.rage ? 2.0 : 2.4;
    const picks = (T.meteors || []).slice().sort(() => Math.random() - 0.5).slice(0, B.rage ? 4 : 3);
    picks.forEach((m) => {
      m.ring.material.color.setHex(0xff5566);
      B.rain.push({ m, t: T0, t0: T0, hit: 0 });
      const sh = new THREE.Mesh(GO, new THREE.MeshBasicMaterial({ color: 0xffb060 }));
      sh.scale.setScalar(1.3); sh.position.set(m.x, m.y + 34, m.z); sc.add(sh);

    setTimeout(() => { B.pose = "idle"; }, 1400);
  }
  function atkYawn() {
    B.pose = "laugh";
    const ms = T.meteors || [];
    if (!ms.length) return;
    const safe = ms[Math.floor(Math.random() * ms.length)];
    const T0 = 3.8;
    B.yawn = { t: T0, t0: T0, safe };
    ms.forEach((m) => {
      m.ring.material.color.setHex(m === safe ? 0x66ffe0 : 0xff4040);
      m.ring.material.opacity = 1;
    });
    msg("SHE YAWNS — STAND ON THE CYAN METEOR");
    announce("SUPERNOVA", "#ff88aa");
    T.sfx(70, 1.6, "sawtooth");
    setTimeout(() => { B.pose = "laugh"; }, 2400);
  }

  function bossFrame(dt) {
    const e = B.god;
    if (!e) return;
    /* charge-up flashes */
    if (B.fx && B.fx.length) {
      B.fx = B.fx.filter((f) => {
        f.t += dt;
        const k = Math.min(1, f.t / f.life);
        if (k >= 1) { sc.remove(f.m); return false; }
        f.m.scale.setScalar(1 + f.grow * k);
        f.m.material.opacity = 0.95 * (1 - k * 0.6);
        return true;
      });
    }
    if (B.phase === "fight") {
      if (B.queue.length) {
        B.queue.forEach((q) => { q.t -= dt; });
        B.queue.filter((q) => q.t <= 0).forEach((q) => { q.t = 99; q.fn(); });
        B.queue = B.queue.filter((q) => q.t < 90);
      }
      /* meteor rain impacts */
      B.rain = B.rain.filter((r) => {
        r.t -= dt;
        const m = r.m;
        if (m.sh) {
          m.sh.position.y = m.y + Math.max(0.1, (r.t / (r.t0 || 1.5)) * 34);
          m.sh.rotation.x += dt * 6;
        }
        if (r.t <= 0) {
          if (m.sh) { sc.remove(m.sh); m.sh = null; }
          m.ring.material.color.setHex(0x8fd0ff);
          puff(new THREE.Vector3(m.x, m.y + 0.4, m.z), 0xffaa55, 26);
          try { ringFx(new THREE.Vector3(m.x, m.y + 0.2, m.z), 0xff9a55, 7, 0.5); } catch (err) {}
          if (onMeteor() === m) hurt(14);
          T.sfx(110, 0.4, "sawtooth");
          return false;
        }
        return true;
      });
      /* supernova */
      if (B.yawn) {
        B.yawn.t -= dt;
        B.mglow.material.opacity = 0.16 + Math.sin(B.t * 22) * 0.12 + ((B.yawn.t0 || 2.7) - B.yawn.t) * 0.05;
        if (B.yawn.t <= 0) {
          const safe = B.yawn.safe;
          const standing = onMeteor();
          B.yawn = null;
          B.mglow.material.opacity = 0.16;
          (T.meteors || []).forEach((m) => m.ring.material.color.setHex(0x8fd0ff));
          for (let k = 0; k < 3; k++) setTimeout(() => {
            const rr = new THREE.Mesh(new THREE.RingGeometry(1, 1.25, 60), new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, side: 2 }));
            rr.rotation.x = 1.57; rr.position.set(0, 7, 0); sc.add(rr);
            let s = 1; const t2 = setInterval(() => { s += 3.4; rr.scale.setScalar(s); rr.material.opacity = Math.max(0, 1 - s / 90); if (s > 90) { clearInterval(t2); sc.remove(rr); } }, 16);
          }, k * 90);
          T.sfx(60, 0.9, "sawtooth"); T.sfx(180, 0.5, "square");
          if (standing !== safe) { hurt(26); msg("THE SUPERNOVA CATCHES YOU"); }
          else { msg("YOU RODE IT OUT"); announce("SURVIVED", "#8fe9ff"); }
        }
      }
    }
    /* some weapons erase platforms — keep the meteors solid */
    if (T.meteors.length && G.pl.length < T.meteors.length) {
      T.meteors.forEach((m) => {
        if (!G.pl.some((p) => p.x === m.x && p.z === m.z)) plat(m.x, m.y, m.z, m.r, 0x3a3f66);
      });
    }
    /* pose / idle motion */
    if (e.m) {
      T.pose(e.m, B.t, { pose: B.pose, base: 7.2, float: 0.08, sit: true });
      e.m.rotation.y = Math.atan2(cam.position.x - 0, cam.position.z - 0);
    }
    /* keep the player off the void */
    if (G.st === "play" && cam.position.y < 2.4) {
      const ms = (T.meteors || []).slice().sort((a, b) =>
        Math.hypot(cam.position.x - a.x, cam.position.z - a.z) - Math.hypot(cam.position.x - b.x, cam.position.z - b.z));
      const m = ms[0];
      if (m) { cam.position.set(m.x, m.y + 1.7, m.z); G.vy = 0; }
      hurt(22); msg("THE VOID BITES — GET BACK ON A METEOR");
    }
  }

  /* --- defeat --- */
  function startDefeat() {
    if (B.phase === "defeat") return;
    B.phase = "defeat";
    G.story = 0;
    G.st = "story";
    document.exitPointerLock && document.exitPointerLock();
    G.pr.forEach((p) => sc.remove(p.m)); G.pr = [];
    G.en.filter((x) => x !== B.god).forEach((x) => { x.nocmb = 1; kill(x); });
    B.rain.forEach((r) => { if (r.m.sh) sc.remove(r.m.sh); r.m.ring.material.color.setHex(0x8fd0ff); });
    B.rain = [];
    $i("stCine").classList.add("on");
    T.music("city");
    T.setFrame(defeatFrame);
    B.dt2 = 0;
    T.setTitle("", "", "");
    T.sfx(220, 1.2, "sine");
    B.defeatReady = 0; B.dl = 0;

    setTimeout(() => { if (B.phase === "defeat") { T.say("GODDESS OF THE STARS", DEFEAT_LINES[0]); B.defeatReady = 1; } }, 900);
  }
  const DEFEAT_LINES = [
    "You actually meant it. You stood in front of a goddess and refused to run.",
    "I have watched a hundred thousand of your kind end. None of them were this stubborn.",

  function defeatLine(n) {

  document.addEventListener("click", (e) => {
    if (B.phase !== "defeat" || !B.defeatReady) return;

  function defeatFrame(dt) {
    B.t += dt;

     patches into the base game
     ======================================================= */
  /* victory of an ordinary story battle */
  const _reward2 = window.reward2;

    el.classList.add("on");
    announce("CLEARED", "#8fe9a8");

    window.stWinNext = function () {

      T.reward("weapon", () => T.finish(i));

  /* death */
  const _hurt = window.hurt;

  function failScreen() {
    T.failing = 1;

    ov(`<div class="rush-k">DEFEATED</div><h1>${e.t}</h1>

      <div><button onclick="stRetry()">RETRY MATCH</button><button onclick="stQuit()">CAMPAIGN MAP</button></div>`);
  }
  window.stRetry = function () {

  /* boss AI hook */

        <div class="en">☠ ${Math.max(0, Math.ceil(b.hp))} / ${b.mhp}</div>${B.rage ? '<div class="tag">FURIOUS</div>' : ""}`;
      const bn = $i("bn"), bbf = $i("bbf");
      if (bn) bn.textContent = "GODDESS OF THE STARS   " + Math.max(0, Math.ceil(b.hp)) + " / " + b.mhp;
      if (bbf) bbf.style.width = Math.max(0, (b.hp / b.mhp) * 100) + "%";
      const bb = $i("bb");
      if (bb && b.hp > 0) bb.style.display = "block";
    }
  };

  /* leaving story battles cleans the arena props */
  const _openMap = T.openMap;
  T.openMap = function () {
    ov("");
    if (T.meteors && T.meteors.length) { try { setMap(0); } catch (e) {} }
    (T.arenaExtra || []).forEach((o) => { try { sc.remove(o); } catch (e) {} });
    T.arenaExtra = [];
    T.meteors = [];
    T.mode = "map";
    B.god = null; B.phase = "idle"; B.rain = []; B.yawn = null;
    _openMap();
  };
  const _finish = T.finish;
  T.finish = function (i, opts) { ov(""); _finish(i, opts); };

  /* clicking the canvas re-captures the mouse after a cinematic */
  document.addEventListener("click", () => {
    if (!G.story || G.st !== "play") return;
    if (document.pointerLockElement) return;
    try { ren.domElement.requestPointerLock(); } catch (e) {}
  });

  console.log("[story] battles ready");
})();

    body.position.y = y0 + H / 2; g.add(body);
    const edge = (y) => { const t = new THREE.Mesh(new THREE.TorusGeometry(1, 0.035, 6, 72), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })); t.rotation.x = Math.PI / 2; t.position.y = y; g.add(t); };
    edge(y1); if (y0 > 0) edge(y0); else edge(0.06);
    if (type === "C") { for (let k = 0; k < 24; k++) { const a = (k / 24) * 6.283, v = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 5.9, 5), new THREE.MeshBasicMaterial({ color: 0xa8ffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8 })); v.position.set(Math.cos(a), y0 + H / 2, Math.sin(a)); g.add(v); } }
    sc.add(g);
    return g;
  }
  function p2Frame(dt) {
    const e = B2.e; B2.p2t += dt;
    const t = B2.p2t;
    /* the drain: 25 HP every second, no exceptions */
    if (!G.god && G.hp > 0) { G.hp -= 25 * dt; if (G.hp <= 0) { G.hp = 0.1; hurt(9999); return; } }
    if (Math.floor(t * 3) !== Math.floor((t - dt) * 3)) { const fl = $i("fl"); if (fl) fl.style.opacity = 0.18; }
    /* controls */
    G.crouch = (K.Enter || K.NumpadEnter) && G.onG ? 1 : 0;
    /* launch schedule + cue */
    SEQ.forEach((s, k) => {
      if (!s.done && t >= s[1]) { s.done = 1; const w = { g: mkWave(s[0]), type: s[0], R: 3, hit: 0 }; w.g.position.set(0, 0, 0); B2.waves.push(w); T.sfx(s[0] === "C" ? 140 : 90, 0.25, "sawtooth"); }
    });
    let best = null;
    SEQ.forEach((s) => { if (t >= s[1] - (s[0] === "D" ? TCIRules.RULES.doubleWarning : 1.15) && t < s[1] + 0.3) { if (!best || s[1] < best[1]) best = s; } });
    SEQ.forEach((s, k) => { if (!s.tel && t >= s[1] - (s[0] === "D" ? TCIRules.RULES.doubleWarning : 1.15)) { s.tel = 1; T.sfx(s[0] === "J" ? 440 : s[0] === "D" ? 660 : 220, 0.18, "square"); if (s[0] === "D") setTimeout(() => T.sfx(880, 0.18, "square"), 160); } });
    if (best) { const c = WTXT[best[0]]; E2.cue(c[2] + " " + c[0], c[1], "#" + WCOL[best[0]].toString(16).padStart(6, "0"), true); } else E2.cue("", "", "", false);
    /* waves */
    const px = cam.position.x, pz = cam.position.z, dist = Math.hypot(px, pz);
    const eye = G.crouch ? 0.85 : 1.7, bot = cam.position.y - eye, top = cam.position.y + 0.15;
    B2.waves.forEach((w) => {
      w.R += (w.type === "D" ? 9 : WSPEED) * dt; w.g.scale.set(w.R, 1, w.R);
      const [y0, y1] = WBAND[w.type];
      if (!w.hit && Math.abs(dist - w.R) < 1.0 + 0.35 && bot < y1 && top > y0 && !(w.type === "D" && G.jmp === 1 && G.time - G.doubleAt < TCIRules.RULES.doubleGrace)) { w.hit = 1; hurt(10); E2.flash("#ff5030", 0.35, 0.4); msg(w.type === "J" ? "YOU NEEDED TO JUMP" : w.type === "D" ? "YOU NEEDED TO DOUBLE JUMP" : "YOU NEEDED TO CROUCH"); }
    });
    B2.waves = B2.waves.filter((w) => { if (w.R > 72) { sc.remove(w.g); return false; } return true; });
    /* him */
    const hover = 9.5 + Math.sin(t * 1.6) * 0.35;
    e.m.position.set(0, hover, 0);
    E2.animWise(e.m, t, { up: 1, squint: 0, glow: 0.2 });
    updateLimbs(dt, 1, true);
    if (t >= P2_LEN) endPhase2();
  }
  function endPhase2() {
    B2.phase = "fall"; B2.t = 0;
    T.noWeapons = 0; G.crouch = 0; E2.cue("", "", "", false);
    B2.waves.forEach((w) => sc.remove(w.g)); B2.waves = [];
    G.mx = B2.savedMx || 150; B2.savedMx = 0; G.hp = Math.min(G.hp, G.mx); G.grav = 25;
    SEQ.forEach((s) => { s.done = 0; s.tel = 0; });
    E2.tag(""); announce("WEAPONS RETURN", "#8fe9a8"); msg("HE COMES BACK DOWN — FIGHT");
    wiseEyes(0xbfff7a); T.sfx(300, 0.6, "triangle");
    B2.fallFrom = B2.e.m.position.clone();
  }

  /* ---- main boss frame ---- */
  function bossFrame(dt) {
    const e = B2.e; if (!e) return;
    B2.t += dt;
    /* safety: nothing but the damage hook may move his HP */
    if (B2.phase === "p1" && e.hp <= 1500) { e.hp = 1500; startPhase2(); }
    else if (B2.phase === "rise" || B2.phase === "p2" || B2.phase === "fall") { if (e.hp < 1500) e.hp = 1500; if (e.hp > 1500) e.hp = 1500; }
    else if (B2.phase === "p3" && e.hp <= 1) { e.hp = 1; startDefeat2(); return; }
    /* effects */
    B2.fx = B2.fx.filter((f) => {
      f.t += dt; const k = Math.min(1, f.t / f.life);
      if (f.fire && f.t >= f.life) { f.fire(); return false; }
      if (f.fn) f.fn(f, k);
      if (k >= 1) { sc.remove(f.m); return false; }
      return true;
    });
    B2.hz = B2.hz.filter((h) => {
      h.t -= dt; const k = 1 - h.t / h.t0;
      h.ring.material.opacity = 0.5 + Math.sin(B2.t * 18) * 0.35; h.ring.scale.setScalar(1 + Math.sin(B2.t * 10) * 0.03);
      if (h.t <= 0) { erupt(h); sc.remove(h.ring); return false; }
      return true;
    });
    const ph = B2.phase;
    if (ph === "p1" || ph === "p3") {
      E2.animWise(e.m, B2.t, { talk: 0, up: 0.1 });
      B2.cd -= dt; if (B2.cd <= 0) nextAttack();
      if (ph === "p3") E2.tag("");
    } else if (ph === "rise") {
      const u = clamp(B2.t / RISE_T, 0, 1), s = u * u * (3 - 2 * u);
      e.m.position.set(HOME.x * (1 - s), 9.5 * s, HOME.z * (1 - s));
      E2.animWise(e.m, B2.t, { up: s, glow: 0.2 });
      updateLimbs(dt, u, true);
      if (u >= 1) {
        B2.phase = "p2"; B2.p2t = 0;
        B2.savedMx = G.mx; G.mx = 300; G.hp = 300; G.grav = 15;
        SEQ.forEach((q) => { q.done = 0; q.tel = 0; });
        E2.tag("BRANCH-BOUND  ·  WEAPONS SEALED  ·  −25 HP / SEC");
        msg("SPACE = JUMP   ·   ENTER = CROUCH");
        announce("SURVIVE", "#ff8a8a");
      }
    } else if (ph === "p2") {
      p2Frame(dt);
    } else if (ph === "fall") {
      const u = clamp(B2.t / FALL_T, 0, 1), s = u * u * (3 - 2 * u), a = B2.fallFrom;
      e.m.position.set(a.x + (HOME.x - a.x) * s, a.y * (1 - s), a.z + (HOME.z - a.z) * s);
      E2.animWise(e.m, B2.t, { up: 1 - s });
      updateLimbs(dt, 1 - u, u < 1);
      if (u >= 1) {
        B2.limbs.forEach((l) => sc.remove(l.m)); B2.limbs = [];
        B2.phase = "p3"; B2.n = 0; B2.cd = 2.6;
        e.m.position.copy(HOME);
        announce("HE IS ANGRY", "#ff9a6a"); msg("PHASE 3 — FASTER BRANCHES AND SEEDS");
      }
    }
  }

  /* ---- defeat ---- */
  function startDefeat2() {
    const e = B2.e;
    B2.phase = "defeat"; G.st = "story";
    try { document.exitPointerLock && document.exitPointerLock(); } catch (x) {}
    T.noWeapons = 0; G.crouch = 0; E2.clearFx();
    G.pr.forEach((p) => { try { sc.remove(p.m); } catch (x) {} }); G.pr = [];
    B2.hz.forEach((h) => { try { sc.remove(h.ring); } catch (x) {} }); B2.hz = [];
    announce("THE WISE TREE FALLS", "#bfff9a");
    T.sfx(55, 2, "sawtooth");
    $i("stCine").classList.add("on"); T.hudVis(false);
    B2.talk = { kind: "defeat", n: 0, t: 0, ready: 0, said: 0 };
    T.skipFn = () => finishBoss();
    T.setFrame(talkFrame);
    cam.position.set(12, 6, 2);
    wiseEyes(0xbfff7a);
  }
  function defeatAnim(dt) {
    const e = B2.e, d = B2.talk; if (!e) return;
    d.t += dt;
    cam.position.lerp(new THREE.Vector3(10, 5.5, -2), 0.03); cam.lookAt(0, 5.5, -16);
    const k = clamp(d.t / 3.2, 0, 1);
    e.m.rotation.x = -0.35 * k; e.m.position.y = -0.9 * k; e.m.scale.setScalar(1.9 * (1 - 0.05 * k));
    E2.animWise(e.m, d.t, { up: 0, squint: 1 });
    e.m.userData.cg.material.opacity = 0.45 * (1 - k);
    if (!d.said && d.t > 3.4) { d.said = 1; d.ready = 1; T.say(DEFEAT_LINES[0][0], DEFEAT_LINES[0][1]); }
  }
  function finishBoss() {
    if (B2.phase === "done") return;
    B2.phase = "done"; B2.talk = null; T.skipFn = null; T.hideDlg();
    const e = B2.e;
    if (e) { const ix = G.en.indexOf(e); if (ix >= 0) G.en.splice(ix, 1); try { sc.remove(e.m); } catch (x) {} }
    G.bi = null;
    const bb = $i("bb"); if (bb) bb.style.display = "none";
    storyWin2(10, WIN_TXT[10]);
  }

  /* ---------------- hooks into existing systems ---------------- */
  const _fireW = window.fireW;
  window.fireW = function () { if (T.noWeapons) return; return _fireW.apply(this, arguments); };

  const _dmg = window.dmg;
  window.dmg = function (e, d, s) {
    if (e && e.guard) {
      if (e.down) return;
      if (e.hp - d <= 1) { e.hp = 1; e.fl = 0.15; downGuard(e); return; }
    }
    if (e && e.wise) {
      const ph = B2.phase;
      if (ph === "p1") { if (e.hp - d <= 1500) { e.hp = 1500; e.fl = 0.12; startPhase2(); return; } }
      else if (ph === "p3") { if (e.hp - d <= 1) { e.hp = 1; e.fl = 0.12; startDefeat2(); return; } }
      else return;
    }
    return _dmg(e, d, s);
  };
  const _upE = window.upE;
  window.upE = function (e, dt) {
    if (e && e.wise) return;
    if (e && e.guard && e.down) return;
    return _upE(e, dt);
  };
  const _animE = window.animE;
  window.animE = function (e, dt) {
    if (e && e.wise) return;
    if (e && e.guard && e.down) { e.m.rotation.x += (0.55 - e.m.rotation.x) * 0.1; e.m.position.y += (e.base * 0.5 - e.m.position.y) * 0.1; return; }
    return _animE(e, dt);
  };

  const _hud = window.hud;
  window.hud = function () {
    _hud();
    if (!G.story || T.isl !== 2 || T.curIdx === undefined) return;
    const m = T.mode;
    if (m !== "e2battle" && m !== "e2guards" && m !== "e2boss") return;
    const inf = $i("inf"); if (!inf) return;
    const en = T.ENC[T.curIdx];
    const n = G.en.filter((x) => !x.decoy && !x.ally && !x.absent).length;
    if (m === "e2battle") {
      inf.innerHTML = `<div class="wv">MATCH ${en.id}</div><div class="mp">${en.t}</div>
        <div class="er"><u style="width:${G.tot ? Math.min(100, (G.tot - n) / G.tot * 100) : 0}%"></u></div><div class="en">☠ ${n} remaining</div>`;
    } else if (m === "e2guards") {
      const gs = B2.guards.map((g, k) => `GUARD ${k + 1}: ${g.down ? "KNEELING" : Math.max(0, Math.ceil(g.hp)) + " / 1000"}`).join("<br>");
      inf.innerHTML = `<div class="wv">MATCH ${en.id}</div><div class="mp">${en.t}</div><div class="en">${gs}</div>`;
    } else if (B2.e) {
      const b = B2.e, ph = B2.phase;
      const tagTxt = ph === "p2" || ph === "rise" ? "PHASE 2 — WEAPONS SEALED" : ph === "p3" ? "PHASE 3" : "PHASE 1";
      inf.innerHTML = `<div class="wv">MATCH ${en.id}</div><div class="mp">THE WISE TREE</div><div class="en">☠ ${Math.max(0, Math.ceil(b.hp))} / ${b.mhp}</div><div class="tag">${tagTxt}</div>`;
      const bn = $i("bn"), bbf = $i("bbf");
      if (bn) bn.textContent = "THE WISE TREE   " + Math.max(0, Math.ceil(b.hp)) + " / " + b.mhp;
      if (bbf) bbf.style.width = Math.max(0, (b.hp / b.mhp) * 100) + "%";
      const bb = $i("bb"); if (bb && ph !== "intro" && ph !== "done" && ph !== "defeat") bb.style.display = "block";
    }
  };

  /* leaving the fight any other way (retry / quit) restores everything */
  const _retry = window.stRetry;
  window.stRetry = function () { cleanupE2(); return _retry(); };
  const _quit = window.stQuit;
  window.stQuit = function () { cleanupE2(); return _quit(); };
})();

</script>
